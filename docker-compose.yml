# Production-style stack: MySQL + migrations + API + web app (+ optional Caddy for HTTPS).
#
#   cp .env.production.example .env      # then fill in every value
#   docker compose up -d --build                 # app on http://localhost:3000
#   docker compose --profile tls up -d --build   # + automatic HTTPS for $APP_DOMAIN
#
# Only the web app (or Caddy) is published to the host. The API and database stay on the
# private Docker network; the browser reaches the API through the web app's /api proxy.

name: urban-security

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-urbansecurity}
      MYSQL_USER: ${MYSQL_USER:-uss_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-uss_app}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-urbansecurity}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    # Least privilege: the API receives only the settings it needs (no root DB password).
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER:-uss_app}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-urbansecurity}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGINS: ${APP_ORIGIN:?set APP_ORIGIN in .env}
      # 0 (default, fail-safe): never trust X-Forwarded-For.
      # 1: with the tls profile — Caddy routes /api straight here and sets the real client IP.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      ENABLE_SETUP_REGISTRATION: ${ENABLE_SETUP_REGISTRATION:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: same-origin
        API_PROXY_TARGET: http://backend:5000
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["tls"]
    image: caddy:2.8
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env for the tls profile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
